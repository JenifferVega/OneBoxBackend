# Type checking narrowed to the two errors that are REAL crashes, not style.
# A full mypy run on a codebase without annotations produces hundreds of
# warnings and gets ignored; these two do not.
#
#   call-arg      : calling a function with a parameter it does not accept,
#                   or omitting a required one.  This is the TypeError that
#                   reached a user as "missing 1 required positional
#                   argument: 'name'".
#   attr-defined  : reading an attribute/name that does not exist.

[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = silent
disable_error_code = var-annotated, assignment, arg-type, index, union-attr, return-value, misc, valid-type, operator, has-type, no-redef, override, call-overload, dict-item, list-item, type-arg, truthy-function, unused-ignore, import-untyped, annotation-unchecked
exclude = (^mcp/|^tests/|node_modules)

[mypy-boto3.*]
ignore_errors = True

# langchain's chat models are pydantic classes whose fields carry aliases
# (`model` is the alias of `model_name`). mypy sees the field name and not the
# alias, so a correct call reads as an unexpected keyword. False positive.
[mypy-agent.graph.llm_factory]
disable_error_code = call-arg
